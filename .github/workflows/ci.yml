name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"  # (nightly: the browser checks)
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Freedoom (Doom pipeline tests)
        run: scripts/fetch_freedoom.sh
      - name: Configure + build
        run: cmake --preset native-release && cmake --build --preset native-release -j
      - name: Test
        run: ctest --test-dir build/native-release --output-on-failure
      # The engine's behaviour pinned (docs/BASELINE.md): its own world hashes, and the structural
      # reference's (oriented_1) reproduced bit for bit with the switches that restore its solver.
      - name: Golden hashes
        run: tools/baseline/golden.sh build/native-release/tools --threads 4
      # Long sessions: the drive city with its traffic and people, shooting and blasting - the
      # memory it holds must level off.
      - name: Soak (memory levels off)
        run: build/native-release/tools/svx_soak --world drive --minutes 4 --threads 4 --check
      # A performance gate: the fire and the flood run some 5 ms a tick on a quiet 4-core machine
      # (up to 16 with other work on it); a mean over 60 ms is a regression (the structural
      # reference's environment ran them at 95 - 120 ms), not a noisy runner.
      - name: Environment bench (perf gate)
        run: |
          build/native-release/tools/svx_env_bench --scenario fire --threads 4 --budget-ms 60
          build/native-release/tools/svx_env_bench --scenario flood --threads 4 --budget-ms 60

  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: native-asan
            exclude: "^$"
          # (ThreadSanitizer on the suites that drive the core's thread pool; the game suite takes
          # hours under it)
          - preset: native-tsan
            exclude: svx_game_tests
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Freedoom
        run: scripts/fetch_freedoom.sh
      - name: Configure + build
        run: cmake --preset ${{ matrix.preset }} && cmake --build --preset ${{ matrix.preset }} -j
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        # (the game suite takes most of an hour under a sanitizer)
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure --timeout 7200 -E "${{ matrix.exclude }}"

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch Freedoom
        run: scripts/fetch_freedoom.sh
      - name: Configure + build (Emscripten, SIMD128)
        run: cmake --preset wasm-release && cmake --build --preset wasm-release -j
      # (the test binaries run under Node: the toolchain's CMAKE_CROSSCOMPILING_EMULATOR)
      - name: Test under Node
        run: ctest --test-dir build/wasm-release --output-on-failure
      # The same world hashes as natively: bit-identical on every platform.
      - name: Golden hashes under Node (short scenarios)
        run: |
          for t in svx_engine_demo svx_env_bench; do
            printf '#!/bin/sh\nexec node %s/build/wasm-release/tools/%s.js "$@"\n' "$PWD" "$t" > build/wasm-release/tools/$t
            chmod +x build/wasm-release/tools/$t
          done
          tools/baseline/golden.sh build/wasm-release/tools --threads 1 --filter 'side|rooms|slab|chimney'

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The front end in a browser: the rooms, the streamed city, the people, the drive. Nightly and
  # on demand - a GPU-less runner's timings vary too much to hold every push to them. WebGPU is
  # software there (SwiftShader: SMOKE_SWIFTSHADER), the engine the pthreads module the page runs.
  browser:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the engine module
        run: cmake --preset wasm-release-threads && cmake --build --preset wasm-release-threads -j --target svx_web
      - name: Front end
        working-directory: web
        run: npm ci && npm i --no-save puppeteer-core
      - name: Browser checks
        working-directory: web
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SMOKE_SWIFTSHADER: "1"
        run: |
          npx vite --port 5190 --strictPort &
          npx --yes wait-on http://localhost:5190/
          node scripts/smoke-wasm.mjs http://localhost:5190/
          node scripts/people-wasm.mjs http://localhost:5190/
          node scripts/drive-wasm.mjs http://localhost:5190/
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: |
            web/smoke-wasm-out/
            web/people-out/
            web/drive-out/
          if-no-files-found: ignore
